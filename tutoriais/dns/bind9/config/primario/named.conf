include "/etc/bind/shared/lab.key";
include "/etc/bind/shared/options.conf";

zone "lab.test" {
    type primary;
    file "/etc/bind/zones/db.lab.test";
    allow-transfer { key "lab-transfer"; };
    notify explicit;
    // IP do secundario: LAN no modo entre maquinas, rede Docker no modo local.
    also-notify { @DNS_SECONDARY_IP@ port @DNS_PORT@ key "lab-transfer"; };
};
