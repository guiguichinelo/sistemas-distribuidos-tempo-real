include "/etc/bind/shared/lab.key";
include "/etc/bind/shared/options.conf";

zone "lab.test" {
    type secondary;
    // IP do primario na rede escolhida, autenticado por TSIG.
    primaries { @DNS_PRIMARY_IP@ port @DNS_PORT@ key "lab-transfer"; };
    allow-notify { key "lab-transfer"; };
    file "/var/lib/bind/db.lab.test";
    allow-transfer { none; };
    // A zona recebida é gravada no volume, nunca na pasta do host.
};
